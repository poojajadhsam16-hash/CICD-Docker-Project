name: OpsPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t opspulse:${{ github.sha }} .
          docker tag opspulse:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/opspulse:${{ github.sha }}
          docker tag opspulse:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/opspulse:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/opspulse:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/opspulse:latest



